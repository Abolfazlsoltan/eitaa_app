name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils pkg-config

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==1.0.2"

      - name: Verify Flet version
        run: flet --version

      - name: Clean build caches
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper ~/.pub-cache
          rm -rf build .dart_tool .flet
          mkdir -p build_logs

      - name: Build APK
        run: |
          set +e
          flet build apk --verbose > build_logs/flet-build.log 2>&1
          BUILD_EXIT=$?
          echo "exit code: $BUILD_EXIT"
          tail -200 build_logs/flet-build.log
          exit $BUILD_EXIT

      - name: Find APK
        if: always()
        run: |
          find . -type f -name "*.apk" -not -path "./.git/*" -print 2>/dev/null || true
          find . -type f -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-apk
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-build-log
          path: build_logs/flet-build.log
          if-no-files-found: warn
          retention-days: 14
