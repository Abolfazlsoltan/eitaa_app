name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet>=1.0"

      - name: Show environment
        run: |
          python --version
          flutter --version
          flet --version
          java -version
          flutter doctor -v

      - name: Clean build caches
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper
          rm -rf ~/.pub-cache
          rm -rf build
          rm -rf .dart_tool

      - name: Build APK
        run: |
          mkdir -p build_logs
          set -o pipefail
          flet build apk 2>&1 | tee build_logs/flet-build.log

      - name: Find APK
        if: always()
        run: |
          echo "===== APK files ====="
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-app-apk
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-app-build-log
          path: build_logs/flet-build.log
          if-no-files-found: warn
