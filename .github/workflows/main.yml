name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Flet Action
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          # این گزینه باعث می‌شود اکشن به صورت خودکار
          # تمام پیش‌نیازها از جمله Flutter و Android SDK را نصب کند
          # و به هیچ سوال تعاملی پاسخ ندهد.
          # نیازی به تنظیم دستی JAVA_HOME یا Flutter نیست.

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: build/apk/*.apk
