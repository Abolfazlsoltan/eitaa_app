name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            mesa-utils \
            pkg-config

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Check Flutter and Android environment
        run: |
          flutter --version
          flutter doctor -v
          java -version

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==1.0.3"

      - name: Clean build caches
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper
          rm -rf ~/.pub-cache
          rm -rf build
          rm -rf .dart_tool
          rm -rf .flet

          mkdir -p build_logs

      # ================================================================
      # Attempt 1 — Flet
      # ================================================================
      - name: Build APK with Flet
        id: build1
        continue-on-error: true
        shell: bash
        run: |
          set +e

          echo "===== Starting Flet APK build ====="

          flet build apk --verbose \
            2>&1 | tee build_logs/flet-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "Flet exit code: $EXIT_CODE"

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit "$EXIT_CODE"

      # ================================================================
      # Search for APK after Flet
      # ================================================================
      - name: Search for APK after Flet
        if: always()
        shell: bash
        run: |
          echo "===== APK files after Flet ====="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print \
            2>/dev/null || true

      # ================================================================
      # If Flet failed, inspect generated Flutter project
      # ================================================================
      - name: Investigate Flet failure
        if: steps.build1.outcome == 'failure'
        shell: bash
        run: |
          echo "===== Flet failed ====="

          echo ""
          echo "===== build directory ====="
          if [ -d build ]; then
            find build -maxdepth 4 -type d | sort | head -200
          else
            echo "build directory does not exist"
          fi

          echo ""
          echo "===== Flutter projects ====="
          find . \
            -type f \
            -name "pubspec.yaml" \
            -not -path "./.git/*" \
            -print \
            2>/dev/null || true

          echo ""
          echo "===== Gradle projects ====="
          find . \
            -type f \
            -name "gradlew" \
            -not -path "./.git/*" \
            -print \
            2>/dev/null || true

          echo ""
          echo "===== Python files in build ====="
          find build \
            -type f \
            \( -name "main.py" -o -name "app.py" \) \
            2>/dev/null | head -30 || true

          echo ""
          echo "===== site-packages ====="
          find build \
            -type d \
            -name "site-packages" \
            2>/dev/null | head -30 || true

      # ================================================================
      # Attempt 2 — Direct Flutter build
      # ================================================================
      - name: Build APK with Flutter fallback
        if: steps.build1.outcome == 'failure'
        shell: bash
        run: |
          set -e

          if [ ! -d "build/flutter" ]; then
            echo "ERROR: build/flutter does not exist."
            echo "Flet did not generate a Flutter project."
            exit 1
          fi

          cd build/flutter

          echo "===== Flutter project ====="
          ls -la

          echo ""
          echo "===== pubspec.yaml ====="
          cat pubspec.yaml || true

          echo ""
          echo "===== Flutter dependencies ====="
          flutter pub get

          echo ""
          echo "===== Building APK ====="
          flutter build apk --release

      # ================================================================
      # Final APK search
      # ================================================================
      - name: Find final APK
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "FINAL APK SEARCH"
          echo "========================================"

          APK_COUNT=$(find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            2>/dev/null | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK was generated."
            echo ""
            echo "===== Build directory ====="
            find build -maxdepth 5 -type f 2>/dev/null | head -300 || true

            echo ""
            echo "===== Flet build log ====="
            tail -300 build_logs/flet-build.log 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "===== APK files ====="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print \
            2>/dev/null

          echo ""
          echo "===== APK sizes ====="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -exec ls -lh {} \; \
            2>/dev/null

      # ================================================================
      # Upload APK
      # ================================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-apk
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 30

      # ================================================================
      # Upload logs
      # ================================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-build-log
          path: |
            build_logs/**
          if-no-files-found: warn
          retention-days: 14
