name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.22.1"
      # نسخه‌ی Flet که هم با jni_flutter جدید سازگار است و هم override قدیمی jni را ندارد
      FLET_VERSION: "1.0.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Flet در مرحله‌ی package همه‌ی فایل‌های src را کامپایل می‌کند و با SyntaxError کل build می‌شکند.
      - name: Syntax check (src/)
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = 0
          for f in sorted(pathlib.Path("src").rglob("*.py")):
              try:
                  ast.parse(f.read_text(encoding="utf-8"), str(f))
              except SyntaxError as e:
                  bad += 1
                  print(f"::error file={f},line={e.lineno}::SyntaxError: {e.msg}")
          sys.exit(1 if bad else 0)
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet-cli==${FLET_VERSION}" "flet==${FLET_VERSION}"

      # نسخه‌ی Flutter را از خود Flet می‌خوانیم تا هیچ‌وقت از آن عقب نیفتد.
      - name: Read Flutter version required by Flet
        id: flutter
        run: echo "version=$(python -c 'import flet.version as v; print(v.flutter_version)')" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        continue-on-error: true   # اگر نشد، خود Flet همان نسخه را نصب می‌کند
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/${{ env.CMAKE_VERSION }}
          key: android-native-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}-v2

      # نصب NDK و CMake با retry (دانلود CMake توسط Gradle بعضاً خراب می‌شود)
      - name: Install Android NDK and CMake (with retries)
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          for attempt in 1 2 3 4; do
            if timeout 600 "$SDKM" --install "cmake;$CMAKE_VERSION" "ndk;$NDK_VERSION"; then
              break
            fi
            echo "sdkmanager attempt $attempt failed"
            [ "$attempt" = 4 ] && exit 1
            rm -rf "$SDK/cmake/$CMAKE_VERSION" "$SDK/ndk/$NDK_VERSION" "$SDK/.temp"
            sleep 20
          done
          "$SDK/cmake/$CMAKE_VERSION/bin/cmake" --version

      # پاک کردن کش Flutter/Pub تا overrideهای قدیمی jni حذف شوند
      - name: Clean stale Flutter artifacts
        shell: bash
        run: |
          rm -rf ~/.pub-cache/hosted/pub.dev/jni-1.0.0 \
                 ~/.pub-cache/hosted/pub.dev/jni_flutter-* \
                 build/ 2>/dev/null || true

      # ------------------------------------------------------------------
      # NEW: dynamic versionCode
      #
      # Bumps the local version segment in pyproject.toml to X.Y.Z+<run>,
      # so every build produces a unique versionCode. Without this, Android
      # rejects installing a new APK over a previously installed one.
      #
      # The step is written to be a no-op on any unexpected condition:
      #   * missing pyproject.toml         → skip
      #   * no `version = "X.Y.Z"` line    → skip
      #   * write error                    → skip
      # so the workflow always reaches `flet build apk` with a valid file.
      # ------------------------------------------------------------------
      - name: Set dynamic versionCode in pyproject.toml
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          path = pathlib.Path("pyproject.toml")
          if not path.exists():
              print("::warning::pyproject.toml not found; skipping version bump.")
              sys.exit(0)

          src = path.read_text(encoding="utf-8")
          run_number = (os.environ.get("GITHUB_RUN_NUMBER") or "1").strip() or "1"

          pattern = re.compile(
              r'(?m)^(version\s*=\s*")([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?(")'
          )

          def repl(match):
              return f"{match.group(1)}{match.group(2)}+{run_number}{match.group(3)}"

          new_src, count = pattern.subn(repl, src, count=1)
          if count == 0:
              print("::warning::No version line matched; leaving pyproject.toml untouched.")
              sys.exit(0)

          try:
              path.write_text(new_src, encoding="utf-8")
          except OSError as exc:
              print(f"::warning::Could not write pyproject.toml ({exc}); leaving unchanged.")
              sys.exit(0)

          print(f"::notice::pyproject version set for build number {run_number}")
          PY

      - name: Show resolved version line
        shell: bash
        run: grep -E '^version[[:space:]]*=' pyproject.toml || true

      # ------------------------------------------------------------------
      # NEW: optional release signing
      #
      # Activates only when the repository secrets below are configured:
      #   * ANDROID_KEYSTORE_BASE64     (base64 of release.jks)
      #   * ANDROID_KEYSTORE_PASSWORD   (keystore password)
      #   * ANDROID_KEY_PASSWORD        (key password)
      #   * ANDROID_KEY_ALIAS           (key alias)
      #
      # When the secret is missing, this step is skipped entirely and the
      # workflow uses exactly the same command as before, so the working
      # build path is unchanged.
      # ------------------------------------------------------------------
      - name: Setup release signing (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          KEYSTORE_PATH="$RUNNER_TEMP/signing/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          {
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$KEYSTORE_PATH"
            echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$KEYSTORE_PW"
            echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=$KEY_PW"
            echo "FLET_ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Build
      #
      # When signing is not configured, this runs the exact same command
      # as before: `flet build apk --verbose`.
      # When signing is configured, the standard Flet signing flags are
      # appended. The flags are passed via a bash array so the empty case
      # produces no extra arguments at all.
      # ------------------------------------------------------------------
      - name: Build APK with Flet
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build_logs
          SIGN_ARGS=()
          if [[ -n "${FLET_ANDROID_SIGNING_KEY_STORE:-}" ]]; then
            SIGN_ARGS+=(
              --android-signing-key-store "$FLET_ANDROID_SIGNING_KEY_STORE"
              --android-signing-key-store-password "$FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD"
              --android-signing-key-password "$FLET_ANDROID_SIGNING_KEY_PASSWORD"
              --android-signing-key-alias "$FLET_ANDROID_SIGNING_KEY_ALIAS"
            )
          fi
          flet build apk "${SIGN_ARGS[@]}" --verbose 2>&1 | tee build_logs/flet-build.log

      - name: Show end of build log
        if: failure()
        run: tail -n 200 build_logs/flet-build.log || true

      - name: List APK
        if: success()
        run: ls -lh build/apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-build-log
          path: build_logs/**
          if-no-files-found: warn
          retention-days: 14
