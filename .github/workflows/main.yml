name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils pkg-config

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==1.0.3"

      - name: Show environment
        run: |
          python --version
          pip show flet | grep -E "^(Name|Version)"
          flutter --version
          flet --version
          java -version

      # ---- verify sources before building ----
      - name: Verify sources
        run: |
          echo "===== repo root ====="
          ls -la
          echo "===== src/ ====="
          ls -la src/
          echo "===== assets/ ====="
          ls -la assets/ || echo "assets/ MISSING"
          echo "===== icon ====="
          file assets/icon.png || echo "icon.png MISSING"
          echo "===== python syntax check ====="
          python -m compileall -q src/ && echo "SYNTAX OK" || echo "SYNTAX FAILED"

      - name: Clean build caches
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper ~/.pub-cache
          rm -rf build .dart_tool .flet
          mkdir -p build_logs

      # ---- build with TTY emulation so Flet prints the real error ----
      - name: Build APK
        run: |
          set -e
          # `script` allocates a pseudo-TTY, forcing Rich to flush everything.
          script -q -c "flet build apk --verbose" build_logs/flet-build.log || BUILD_EXIT=$?
          BUILD_EXIT=${BUILD_EXIT:-$?}
          
          # Strip ANSI escape codes so the log is readable.
          if [ -f build_logs/flet-build.log ]; then
            sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' build_logs/flet-build.log || true
            echo "===== FLET BUILD LOG (last 100 lines) ====="
            tail -100 build_logs/flet-build.log
          fi
          
          echo "Flet build exit code: $BUILD_EXIT"
          
          # Check if APK was created before exiting
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "ERROR: APK file not found after build!"
            ls -la build/ 2>/dev/null || true
            exit 1
          fi
          
          exit ${BUILD_EXIT:-0}

      # ---- on failure, dump everything we can ----
      - name: Dump full logs on failure
        if: failure()
        run: |
          echo "=========== FULL FLET LOG ==========="
          cat build_logs/flet-build.log || true
          echo ""
          echo "=========== BUILD TREE ==========="
          find build -maxdepth 3 -type d 2>/dev/null || true
          echo ""
          echo "=========== ANY .log FILES ==========="
          find build -name "*.log" -exec echo "--- {} ---" \; -exec tail -200 {} \; 2>/dev/null || true
          echo ""
          echo "=========== GRADLE OUTPUT (if any) ==========="
          find build -path "*gradle*" -name "*.log" -exec cat {} \; 2>/dev/null || true
          find build -name "output-metadata.json" -exec cat {} \; 2>/dev/null || true

      - name: Find APK
        if: always()
        run: |
          echo "===== APK files ====="
          find . -type f -name "*.apk" -print || true
          find . -type f -name "*.apk" -exec ls -lh {} \; || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-apk
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-build-log
          path: build_logs/flet-build.log
          if-no-files-found: warn
          retention-days: 14
