name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
      # نسخه‌هایی که Gradle در لاگ واقعی build درخواست کرد.
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.22.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Flet در مرحله‌ی package همه‌ی فایل‌های src را کامپایل می‌کند (compile.app پیش‌فرض true است)
      # و با یک SyntaxError کل build می‌شکند. اینجا زود و با پیام واضح شکست می‌خوریم.
      - name: Syntax check (src/)
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = 0
          for f in sorted(pathlib.Path("src").rglob("*.py")):
              try:
                  ast.parse(f.read_text(encoding="utf-8"), str(f))
              except SyntaxError as e:
                  bad += 1
                  print(f"::error file={f},line={e.lineno}::SyntaxError: {e.msg}")
          sys.exit(1 if bad else 0)
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet-cli==1.0.3" "flet==1.0.3"

      # نسخه‌ی Flutter را از خود Flet می‌خوانیم تا هیچ‌وقت از آن عقب نیفتد.
      - name: Read Flutter version required by Flet
        id: flutter
        run: echo "version=$(python -c 'import flet.version as v; print(v.flutter_version)')" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        continue-on-error: true   # اگر نشد، خود Flet همان نسخه را نصب می‌کند
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/${{ env.CMAKE_VERSION }}
          key: android-native-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}

      # دانلود CMake توسط خود Gradle یک بار خراب شد («Archive is not a ZIP archive»).
      # اینجا با sdkmanager، تایم‌اوت و چند بار تلاش مجدد از قبل نصبش می‌کنیم.
      - name: Install Android NDK and CMake (with retries)
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          for attempt in 1 2 3 4; do
            if timeout 600 "$SDKM" --install "cmake;$CMAKE_VERSION" "ndk;$NDK_VERSION"; then
              break
            fi
            echo "sdkmanager attempt $attempt failed"
            [ "$attempt" = 4 ] && exit 1
            rm -rf "$SDK/cmake/$CMAKE_VERSION" "$SDK/ndk/$NDK_VERSION" "$SDK/.temp"
            sleep 20
          done
          "$SDK/cmake/$CMAKE_VERSION/bin/cmake" --version

      - name: Build APK with Flet
        shell: bash
        run: |
          mkdir -p build_logs
          flet build apk --verbose 2>&1 | tee build_logs/flet-build.log

      - name: Show end of build log
        if: failure()
        run: tail -n 150 build_logs/flet-build.log || true

      - name: List APK
        run: ls -lh build/apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-build-log
          path: build_logs/**
          if-no-files-found: warn
          retention-days: 14
