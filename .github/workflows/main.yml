name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            unzip \
            xz-utils \
            zip \
            libglu1-mesa \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==1.0.4"

      - name: Detect Flutter version
        id: flutter
        shell: bash
        run: |
          set -euo pipefail

          FLUTTER_VERSION="$(python -c \
            'import flet.version; print(flet.version.flutter_version)')"

          if [ -z "$FLUTTER_VERSION" ]; then
            echo "Could not detect the Flutter version required by Flet."
            exit 1
          fi

          echo "version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "Flutter version: $FLUTTER_VERSION"

      - name: Install Flutter
        shell: bash
        env:
          FLUTTER_VERSION: ${{ steps.flutter.outputs.version }}
        run: |
          set -euo pipefail

          FLUTTER_DIR="$RUNNER_TEMP/flutter"

          echo "Installing Flutter $FLUTTER_VERSION"

          git clone \
            --depth 1 \
            --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git \
            "$FLUTTER_DIR"

          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$FLUTTER_DIR/bin:$PATH"

          flutter --version
          dart --version

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ]; then
            python -m pip install .
          fi

      - name: Prepare Android signing
        if: ${{ env.ANDROID_KEYSTORE_B64 != '' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$ANDROID_KEYSTORE_B64" \
            | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          flet build apk \
            --verbose \
            --yes

      - name: Upload APK artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eitaa-channel-manager-apk
          path: |
            build/**/*.apk
            **/build/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-build-diagnostics
          path: |
            $RUNNER_TEMP/flutter/.pub-cache/log
            ~/.gradle/daemon
            ~/.gradle/caches
          if-no-files-found: ignore
          retention-days: 7
