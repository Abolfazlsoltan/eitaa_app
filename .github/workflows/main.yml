
name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.22.1"
      FLET_VERSION: "1.0.4"
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      # دریافت کد مخزن
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # نصب Python
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # بررسی خطاهای نحوی کدهای پایتون
      - name: Syntax check (src/)
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          source_dir = pathlib.Path("src")
          if not source_dir.is_dir():
              print("::error::The src/ directory was not found.")
              sys.exit(1)

          files = sorted(source_dir.rglob("*.py"))
          if not files:
              print("::error::No Python files were found in src/.")
              sys.exit(1)

          errors = 0

          for file in files:
              try:
                  ast.parse(file.read_text(encoding="utf-8"), str(file))
              except (SyntaxError, UnicodeDecodeError) as error:
                  errors += 1
                  line = getattr(error, "lineno", 1) or 1
                  message = str(getattr(error, "msg", error))
                  print(f"::error file={file},line={line}::{message}")

          if errors:
              print(f"Found {errors} Python syntax/encoding error(s).")
              sys.exit(1)

          print(f"Syntax check passed for {len(files)} Python file(s).")
          PY

      # نصب Java موردنیاز ساخت اندروید
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # نصب نسخه ثابت Flet
      - name: Install Flet CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "flet-cli==${FLET_VERSION}" \
            "flet==${FLET_VERSION}"
          flet --version

      # استخراج نسخه Flutter موردنیاز همین نسخه Flet
      - name: Read Flutter version required by Flet
        id: flutter
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import flet.version as v; print(v.flutter_version)')"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine the required Flutter version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Required Flutter version: $VERSION"

      # نصب Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      # کش ابزارهای حجیم اندروید
      - name: Cache Android NDK and CMake
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/${{ env.CMAKE_VERSION }}
          key: android-native-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}-v2

      # نصب NDK و CMake با تلاش مجدد
      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"

          if [[ -z "$SDKM" ]]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [[ ! -x "$SDKM" ]]; then
            echo "::error::sdkmanager was not found at $SDKM"
            exit 1
          fi

          echo "Android SDK: $SDK"
          echo "sdkmanager: $SDKM"

          yes | "$SDKM" --licenses >/dev/null 2>&1 || true

          INSTALLED=false

          for attempt in 1 2 3 4; do
            echo "Android tools installation attempt $attempt/4"

            if timeout 600 "$SDKM" --install \
              "cmake;$CMAKE_VERSION" \
              "ndk;$NDK_VERSION"; then
              INSTALLED=true
              break
            fi

            echo "Installation attempt $attempt failed."

            if [[ "$attempt" -lt 4 ]]; then
              rm -rf \
                "$SDK/cmake/$CMAKE_VERSION" \
                "$SDK/ndk/$NDK_VERSION" \
                "$SDK/.temp"
              sleep 20
            fi
          done

          if [[ "$INSTALLED" != true ]]; then
            echo "::error::Could not install Android NDK/CMake after four attempts."
            exit 1
          fi

          "$SDK/cmake/$CMAKE_VERSION/bin/cmake" --version
          echo "Android NDK and CMake are ready."

      # پاک‌سازی فایل‌های باقی‌مانده از ساخت‌های قبلی
      - name: Clean stale Flutter artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$HOME/.pub-cache/hosted/pub.dev/jni-1.0.0" \
            "$HOME"/.pub-cache/hosted/pub.dev/jni_flutter-* \
            build/

      # امضای انتشار اختیاری؛ در نبود کلید از این مرحله عبور می‌کند
      - name: Setup release signing (optional)
        if: ${{ env.ANDROID_KEYSTORE_B64 != '' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/signing"
          KEYSTORE_PATH="$RUNNER_TEMP/signing/release.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          if [[ -z "$KEYSTORE_PW" || -z "$KEY_PW" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Keystore exists, but one or more signing secrets are missing."
            exit 1
          fi

          {
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$KEYSTORE_PATH"
            echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$KEYSTORE_PW"
            echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=$KEY_PW"
            echo "FLET_ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

          echo "Release signing configuration prepared."

      # ساخت APK
      - name: Build APK with Flet
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build_logs

          EXTRA_ARGS=()
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"

          EXTRA_ARGS+=(--build-number "$BUILD_NUMBER")

          if [[ -n "${FLET_ANDROID_SIGNING_KEY_STORE:-}" ]]; then
            EXTRA_ARGS+=(
              --android-signing-key-store "$FLET_ANDROID_SIGNING_KEY_STORE"
              --android-signing-key-store-password "$FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD"
              --android-signing-key-password "$FLET_ANDROID_SIGNING_KEY_PASSWORD"
              --android-signing-key-alias "$FLET_ANDROID_SIGNING_KEY_ALIAS"
            )
          fi

          echo "Starting Flet APK build..."
          flet build apk "${EXTRA_ARGS[@]}" --verbose 2>&1 \
            | tee build_logs/flet-build.log

      # نمایش انتهای گزارش در صورت خطا
      - name: Show end of build log
        if: ${{ failure() }}
        shell: bash
        run: |
          if [[ -f build_logs/flet-build.log ]]; then
            tail -n 200 build_logs/flet-build.log
          else
            echo "Flet build log was not created."
          fi

      # بررسی وجود APK خروجی
      - name: Verify APK output
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          APK_FILES=(build/apk/*.apk)

          if [[ ${#APK_FILES[@]} -eq 0 ]]; then
            echo "::error::Build completed, but no APK was found in build/apk/."
            exit 1
          fi

          for apk in "${APK_FILES[@]}"; do
            if [[ ! -s "$apk" ]]; then
              echo "::error::APK file is empty: $apk"
              exit 1
            fi
            ls -lh "$apk"
          done

      # آپلود APK برای دریافت از صفحه اجرای Workflow
      - name: Upload APK
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eitaa-manager-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # نگهداری گزارش‌ها حتی در صورت شکست ساخت
      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eitaa-manager-build-log
          path: build_logs/**
          if-no-files-found: warn
          retention-days: 14
