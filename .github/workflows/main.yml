name: Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # -----------------------------
      # 1. دریافت سورس پروژه
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # 2. نصب Python
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # -----------------------------
      # 3. نصب Java
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # -----------------------------
      # 4. نصب Flutter
      # -----------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      # -----------------------------
      # 5. بررسی نسخه‌ها
      # -----------------------------
      - name: Check build environment
        run: |
          echo "=== Python ==="
          python --version

          echo "=== Java ==="
          java -version

          echo "=== Flutter ==="
          flutter --version

      # -----------------------------
      # 6. نصب Flet
      # -----------------------------
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet>=1.0"

      # -----------------------------
      # 7. بررسی پروژه
      # -----------------------------
      - name: Verify project
        run: |
          echo "=== Project files ==="
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "=== pyproject.toml ==="
          cat pyproject.toml

      # -----------------------------
      # 8. ساخت APK
      # -----------------------------
      - name: Build APK
        run: |
          mkdir -p build_logs

          set -o pipefail

          echo "Starting Flet APK build..."

          flet build apk 2>&1 | tee build_logs/flet-build.log

      # -----------------------------
      # 9. پیدا کردن APK
      # -----------------------------
      - name: Locate APK
        if: always()
        run: |
          echo "=== APK files ==="

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      # -----------------------------
      # 10. نمایش اطلاعات Build
      # -----------------------------
      - name: Show build directory
        if: always()
        run: |
          echo "=== Build directory ==="

          if [ -d "build" ]; then
            find build -maxdepth 5 -type f -print
          else
            echo "build directory does not exist."
          fi

      # -----------------------------
      # 11. ذخیره APK
      # -----------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-app-apk
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: error

      # -----------------------------
      # 12. ذخیره لاگ Build
      # -----------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-app-build-log
          path: build_logs/flet-build.log
          if-no-files-found: warn
