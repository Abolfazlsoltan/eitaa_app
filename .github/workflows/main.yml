name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # --------------------------------------------------------------- setup
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      # ------------------------------------------------------------- install
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet>=1.0,<2.0"

      - name: Show environment
        run: |
          python --version
          pip show flet | grep -E "^(Name|Version)"
          flutter --version
          flet --version
          java -version
          flutter doctor -v

      # --------------------------------------------------------------- build
      - name: Clean build caches
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper
          rm -rf ~/.pub-cache
          rm -rf build
          rm -rf .dart_tool
          rm -rf .flet

      - name: Build APK
        run: |
          mkdir -p build_logs
          set -o pipefail
          flet build apk --verbose 2>&1 | tee build_logs/flet-build.log

      # -------------------------------------------------------------- upload
      - name: Find APK
        if: always()
        run: |
          echo "===== APK files ====="
          find . -type f -name "*.apk" -print || true
          echo "===== Sizes ====="
          find . -type f -name "*.apk" -exec ls -lh {} \; || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-apk
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-build-log
          path: build_logs/flet-build.log
          if-no-files-found: warn
          retention-days: 14
