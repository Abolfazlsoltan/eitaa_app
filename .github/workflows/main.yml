name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade flet
          flet --version

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses

      - name: Clean build directory
        run: |
          flet clean

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          flet build apk --verbose 2>&1 | tee build.log

      - name: Show build directory tree
        if: always()
        run: |
          echo "=== Build directory tree ==="
          find build -type f -name "*.log" 2>/dev/null || echo "no log files found"
          echo "=== serious_python log ==="
          cat build/flutter/build/serious_python/build.log 2>/dev/null || echo "not found"
          echo "=== flutter build log ==="
          cat build/flutter/build.log 2>/dev/null || echo "not found"
          echo "=== All logs in build ==="
          find build -name "*.log" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
          if-no-files-found: error

      - name: Upload full build directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dir
          path: build/
          if-no-files-found: warn

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: build.log
          if-no-files-found: warn
