name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install flet
        run: pip install flet

      - name: Build APK with live pubspec patch
        shell: bash
        run: |
          set +e
          echo ">>> Starting flet build in background..."
          (echo "y" | flet build apk > /tmp/build.log 2>&1) &
          BUILD_PID=$

          wait $BUILD_PID
          EXIT=$?
          echo ">>> flet exited with: $EXIT"

          echo ">>> ALL pubspec.yaml files with jni after build:"
          find "$HOME" "$RUNNER_WORKSPACE" "/tmp" "$PWD" -name "pubspec.yaml" -type f 2>/dev/null | while read f; do
            if grep -q "jni" "$f" 2>/dev/null; then
              echo "--- $f ---"
              grep "jni" "$f"
            fi
          done

          echo ">>> Tail of build log:"
          tail -60 /tmp/build.log

          exit $EXIT

      - name: Locate APK anywhere
        if: always()
        run: |
          echo "=== Searching for any APK on the system ==="
          find / -name "*.apk" 2>/dev/null | head -20 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn
