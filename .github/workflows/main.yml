name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install flet
        run: pip install flet

      - name: Patch flet's jni pin
        run: |
          # پیدا کردن مسیر سایتپکیجها
          SP=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "Site-packages: $SP"
          # پیدا کردن هر فایلی که jni رو پین کرده
          grep -rln "jni" "$SP/flet_cli" 2>/dev/null || true
          # پچ همه فایلهای پایتون در flet_cli که jni: 1.0.0 دارن
          find "$SP/flet_cli" -name "*.py" -exec grep -l "jni" {} \; 2>/dev/null | while read f; do
            echo "Patching: $f"
            sed -i 's/jni: 1\.0\.0/jni: 1.1.0/g' "$f"
            sed -i 's/"jni": "1\.0\.0"/"jni": "1.1.0"/g' "$f"
            sed -i "s/'jni': '1\.0\.0'/'jni': '1.1.0'/g" "$f"
          done
          # همچنین دنبال فایلهای tmpl/yaml/txt بگرد
          find "$SP/flet_cli" -type f \( -name "*.tmpl" -o -name "*.yaml" -o -name "*.yml" -o -name "*.txt" -o -name "*.jinja" -o -name "*.jinja2" \) -exec grep -l "jni" {} \; 2>/dev/null | while read f; do
            echo "Patching: $f"
            sed -i 's/jni: 1\.0\.0/jni: 1.1.0/g' "$f"
            sed -i 's/jni: "1\.0\.0"/jni: "1.1.0"/g' "$f"
          done

      - name: Build APK
        run: echo "y" | flet build apk
        env:
          CI: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: build/apk/*.apk
          if-no-files-found: warn
