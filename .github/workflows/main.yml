name: Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ==============================
      # Checkout repository
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # Setup Python
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ==============================
      # Setup Java
      # ==============================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==============================
      # Setup Flutter
      # ==============================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      # ==============================
      # Show environment
      # ==============================
      - name: Check environment
        run: |
          echo "===== Python ====="
          python --version

          echo ""
          echo "===== Java ====="
          java -version

          echo ""
          echo "===== Flutter ====="
          flutter --version

      # ==============================
      # Accept Android licenses
      # ==============================
      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses

      # ==============================
      # Check Android toolchain
      # ==============================
      - name: Check Android toolchain
        run: |
          flutter doctor -v

      # ==============================
      # Install Flet
      # ==============================
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet>=1.0"

      # ==============================
      # Check project files
      # ==============================
      - name: Check project
        run: |
          echo "===== Project structure ====="
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "===== pyproject.toml ====="

          if [ -f pyproject.toml ]; then
            cat pyproject.toml
          else
            echo "ERROR: pyproject.toml not found!"
            exit 1
          fi

      # ==============================
      # Build APK
      # ==============================
      - name: Build APK
        run: |
          mkdir -p build_logs

          echo "===== Starting Flet APK build ====="

          set -o pipefail

          flet build apk 2>&1 | tee build_logs/flet-build.log

      # ==============================
      # Find APK
      # ==============================
      - name: Find APK
        if: always()
        run: |
          echo "===== Searching for APK files ====="

          find . \
            -type f \
            -name "*.apk" \
            -print || true

      # ==============================
      # Inspect build directory
      # ==============================
      - name: Inspect build directory
        if: always()
        run: |
          echo "===== Build directory ====="

          if [ -d build ]; then
            find build -maxdepth 6 -type f -print
          else
            echo "No build directory found."
          fi

      # ==============================
      # Upload APK
      # ==============================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-app-apk
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: error

      # ==============================
      # Upload build log
      # ==============================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-app-build-log
          path: build_logs/flet-build.log
          if-no-files-found: warn
