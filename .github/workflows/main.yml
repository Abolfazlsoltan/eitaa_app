name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils pkg-config

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==1.0.3" pillow

      # -------- automatically fix the icon to 1024x1024 PNG --------
      - name: Fix app icon
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/icon.png")
          if not src.exists():
              raise SystemExit("assets/icon.png not found")

          img = Image.open(src)
          print(f"before: {img.format} {img.size} {img.mode}")

          if img.mode != "RGBA":
              img = img.convert("RGBA")

          w, h = img.size
          side = min(w, h)
          left = (w - side) // 2
          top = (h - side) // 2
          img = img.crop((left, top, left + side, top + side))
          img = img.resize((1024, 1024), Image.LANCZOS)
          img.save(src, format="PNG", optimize=True)

          print(f"after:  PNG {img.size} {img.mode}")
          PY

      - name: Show environment
        run: |
          python --version
          pip show flet | grep -E "^(Name|Version)"
          flutter --version
          flet --version
          java -version

      - name: Clean build caches
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper ~/.pub-cache
          rm -rf build .dart_tool .flet
          mkdir -p build_logs

      - name: Build APK
        run: |
          set +e
          flet build apk --verbose 2>&1 | tee build_logs/flet-build.log
          BUILD_EXIT=$?
          sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' build_logs/flet-build.log || true
          echo "Flet build exit code: $BUILD_EXIT"
          exit $BUILD_EXIT

      - name: Dump full logs on failure
        if: failure()
        run: |
          echo "=========== FULL FLET LOG ==========="
          cat build_logs/flet-build.log || true
          echo ""
          echo "=========== ANY .log FILES ==========="
          find build -name "*.log" -exec echo "--- {} ---" \; -exec tail -200 {} \; 2>/dev/null || true

      - name: Find APK
        if: always()
        run: |
          echo "===== APK files ====="
          find . -type f -name "*.apk" -print || true
          find . -type f -name "*.apk" -exec ls -lh {} \; || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-apk
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-build-log
          path: build_logs/flet-build.log
          if-no-files-found: warn
          retention-days: 14
