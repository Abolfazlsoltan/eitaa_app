name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install flet
        run: pip install flet

      - name: Diagnose and patch jni pin everywhere
        run: |
          set -x
          SP=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "Site-packages: $SP"

          echo "=== Trigger flet-cli download ==="
          flet --version || true

          echo "=== Search for flet_cli dirs ==="
          find / -type d -name "flet_cli" 2>/dev/null
          find / -type d -name "flet-cli" 2>/dev/null

          echo "=== All files with jni references ==="
          for DIR in "$SP" "$HOME/.flet" "$HOME/.local" "$HOME/.cache"; do
            if [ -d "$DIR" ]; then
              grep -rn "jni" "$DIR" 2>/dev/null | grep -E "1\.0\.0|1\.1\.0" | head -40 || true
            fi
          done

          echo "=== Now patching ==="
          for DIR in "$SP" "$HOME/.flet" "$HOME/.local" "$HOME/.cache"; do
            if [ -d "$DIR" ]; then
              find "$DIR" -type f \( -name "*.py" -o -name "*.tmpl" -o -name "*.yaml" -o -name "*.yml" -o -name "*.jinja" -o -name "*.jinja2" -o -name "*.txt" -o -name "*.json" \) 2>/dev/null | while read f; do
                if grep -q "jni" "$f" 2>/dev/null; then
                  echo "Patching: $f"
                  # regex انعطاف‌پذیر: هر جا jni با 1.0.0 اومده باشه، به 1.1.0 عوض کن
                  sed -i -E 's/(jni['"'"'":= ]+[\^>=~ ]*)1\.0\.0/\11.1.0/g' "$f" || true
                fi
              done
            fi
          done

          echo "=== Verify patch ==="
          for DIR in "$SP" "$HOME/.flet"; do
            grep -rn "jni" "$DIR" 2>/dev/null | grep "1\.0\.0" || echo "No more jni 1.0.0 in $DIR"
          done

      - name: Build APK
        run: echo "y" | flet build apk
        env:
          CI: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: build/apk/*.apk
          if-no-files-found: warn
