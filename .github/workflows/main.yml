name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils pkg-config

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==1.0.3"

      - name: Show files
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== src/ ==="
          ls -la src/
          echo "=== assets/ (if present) ==="
          ls -la assets/ 2>/dev/null || echo "no assets folder"
          echo "=== pyproject.toml ==="
          cat pyproject.toml

      - name: Clean build caches
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper ~/.pub-cache
          rm -rf build .dart_tool .flet
          mkdir -p build_logs

      # ---- build with correct exit code capture (no pipe) ----
      - name: Build APK
        run: |
          set +e
          flet build apk --verbose > build_logs/flet-build.log 2>&1
          BUILD_EXIT=$?
          echo "=== flet build exit code: $BUILD_EXIT ==="
          echo "=== last 200 lines of flet log ==="
          tail -200 build_logs/flet-build.log

          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "=== flet failed — running flutter directly for real error ==="
            if [ -d build/flutter ]; then
              cd build/flutter
              echo "--- flutter pub get ---"
              flutter pub get 2>&1 | tail -80 || true
              echo ""
              echo "--- flutter build apk ---"
              flutter build apk --release 2>&1 | tail -200 || true
            else
              echo "no build/flutter directory found"
              find . -maxdepth 3 -type d | head -50
            fi
          fi
          exit $BUILD_EXIT

      - name: Find APK
        if: always()
        run: |
          echo "===== APK files ====="
          find . -type f -name "*.apk" -print 2>/dev/null || true
          find . -type f -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-apk
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-build-log
          path: build_logs/flet-build.log
          if-no-files-found: warn
          retention-days: 14
