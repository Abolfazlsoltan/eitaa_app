name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Disposable test-only key; never use this value for a real deployment.
      APP_SECRET_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DATABASE_URL: "sqlite:///./test-ci.db"
      AI_API_KEY: "ci-test-key"
      AI_PROVIDER: "groq"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==1.0.4" "httpx>=0.27,<1.0" -r backend/requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  build-apk:
    # Build on pull requests too, so a green PR proves the Android package
    # can be produced; the artifact is useful for validation, not a release.
    needs: test
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # Flet itself downloads the matching Flutter SDK and Android SDK on the
      # first `flet build`, so they are not installed manually here.
      # Keep this version the same as the one in your pyproject.toml / local env.
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]==1.0.4" pillow

      # Flet packages the launcher icon from the app directory (src/assets),
      # while the original artwork is kept at repository-root assets/icon.png.
      # Resize it to the recommended square format before packaging.
      - name: Restore custom app icon
        run: |
          set -euo pipefail
          test -s assets/icon.png
          mkdir -p src/assets
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("assets/icon.png")
          destination = Path("src/assets/icon.png")
          with Image.open(source) as image:
              image = image.convert("RGBA")
              width, height = image.size
              side = min(width, height)
              left = (width - side) // 2
              top = (height - side) // 2
              image = image.crop((left, top, left + side, top + side))
              image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
              image.save(destination, format="PNG", optimize=True)

          # Use the same custom artwork on the Android launch screen too;
          # otherwise Flet may fall back to its own splash illustration.
          splash = Path("src/assets/splash.png")
          splash.write_bytes(destination.read_bytes())

          for path in (destination, splash):
              with Image.open(path) as check:
                  if check.format != "PNG" or check.size != (1024, 1024):
                      raise SystemExit(f"Custom artwork failed validation: {path}")
                  print(f"Using custom artwork: {path} {check.format} {check.size}")
          PY

      - name: Build APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::Missing required signing secret: $name"
                exit 1
              fi
            done
            KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

            # These are the variable names Flet actually reads.
            export FLET_ANDROID_SIGNING_KEY_STORE="$KEYSTORE_PATH"
            export FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export FLET_ANDROID_SIGNING_KEY_ALIAS="$ANDROID_KEY_ALIAS"
            export FLET_ANDROID_SIGNING_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::No keystore secret found - the APK will be signed with the debug key."
          fi

          flet build apk --verbose --yes --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eitaa-channel-manager-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-build-diagnostics
          path: build/flutter/build/app/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
