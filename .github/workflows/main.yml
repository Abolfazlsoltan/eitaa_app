name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils pkg-config

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==1.0.3"

      - name: Clean build caches
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper ~/.pub-cache
          rm -rf build .dart_tool .flet
          mkdir -p build_logs

      # ================================================================
      # Attempt 1 — Flet's normal build
      # ================================================================
      - name: Build APK (attempt 1 - flet)
        id: build1
        continue-on-error: true
        run: |
          set +e
          flet build apk --verbose > build_logs/flet-build.log 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      # ================================================================
      # If flet failed — investigate and try direct flutter build
      # ================================================================
      - name: Investigate build tree
        if: steps.build1.outcome == 'failure'
        run: |
          echo "===== build/ top-level ====="
          find build -maxdepth 3 -type d 2>/dev/null | sort | head -80
          echo ""
          echo "===== Looking for site-packages ====="
          find build -type d -name "site-packages" 2>/dev/null | head -10
          echo ""
          echo "===== Looking for app.py or main.py inside build ====="
          find build -maxdepth 6 -type f \( -name "main.py" -o -name "app.py" \) 2>/dev/null | head -10
          echo ""
          echo "===== build/flutter directory contents ====="
          ls -la build/flutter/ 2>/dev/null || echo "no build/flutter"
          echo ""
          echo "===== build/flutter/app if exists ====="
          ls -la build/flutter/app/ 2>/dev/null || echo "no build/flutter/app"

      - name: Build APK (attempt 2 - direct flutter)
        if: steps.build1.outcome == 'failure'
        run: |
          set +e

          if [ ! -d build/flutter ]; then
            echo "build/flutter does not exist — cannot retry"
            exit 1
          fi

          # Find where serious_python put the site-packages.
          SP=$(find build -type d -name "site-packages" 2>/dev/null | head -1)
          if [ -z "$SP" ]; then
            # Flet's usual location is build/flutter/app/.
            SP="$(pwd)/build/flutter/app"
            echo "no site-packages found, guessing: $SP"
          fi
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$SP"

          # Also set the older name for backwards compatibility.
          export SERIOUS_PYTHON_SITE_PACKAGES="$SP"
          export SERIOUS_PYTHON_SITE_PACKAGES_DIR="$SP"

          cd build/flutter

          # Stop any stale daemon.
          pkill -f gradle || true

          echo "===== flutter build apk ====="
          flutter build apk --release 2>&1 | tail -300
          exit ${PIPESTATUS[0]}

      # ================================================================
      # Collect result
      # ================================================================
      - name: Find APK
        if: always()
        run: |
          echo "===== APK files ====="
          find . -type f -name "*.apk" -print 2>/dev/null || true
          find . -type f -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-apk
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eitaa-manager-build-log
          path: build_logs/flet-build.log
          if-no-files-found: warn
          retention-days: 14
