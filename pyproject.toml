[project]
name = "eitaa-manager"
version = "2.0.0"
description = "مدیریت هوشمند کانال‌های ایتا"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet>=1.0,<2.0",
    "httpx>=0.27",
]

[tool.flet]
product = "ایتا منیجر"
org = "app.eitaamanager"

[tool.flet.app]
path = "src"

# Pin the whole serious_python family to 4.x.
# The 5.0.0 line requires SERIOUS_PYTHON_SITE_PACKAGES at Gradle time,
# which Flet 1.0.3 does not set. 4.7.2 (recommended by pub) has no such
# requirement and stays fully compatible with Flet 1.0.3.
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"
serious_python = "4.7.2"
