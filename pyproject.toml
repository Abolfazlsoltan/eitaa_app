[project]
name = "eitaa-manager"
version = "2.0.0"
description = "مدیریت هوشمند کانال‌های ایتا"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet==1.0.3",
    "httpx>=0.27",
]

[tool.flet]
product = "ایتا منیجر"
org = "app.eitaamanager"

[tool.flet.app]
path = "src"

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"
