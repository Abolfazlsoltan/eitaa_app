[project]
name = "eitaa-manager"
version = "2.0.0"
description = "مدیریت هوشمند کانال‌های ایتا"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet>=1.0,<2.0",
    "httpx>=0.27",
]

[tool.flet]
product = "ایتا منیجر"
org = "app.eitaamanager"

[tool.flet.app]
path = "src"

# Pin transitive Flutter dependencies to versions compatible with Flet 1.0.3.
# serious_python_android 5.0.0 requires SERIOUS_PYTHON_SITE_PACKAGES to be set
# at Gradle time, but Flet 1.0.3 does not set it — so we force 4.x.
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"
serious_python_android = "4.1.0"
