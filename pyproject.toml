[project]
name = "eitaa-manager"
version = "2.0.0"
description = "مدیریت هوشمند کانال‌های ایتا"
# قفل کردن نسخه پایتون روی 3.12 که با کتابخانه‌های اندروید سازگاری کامل دارد
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet==1.0.3",
    "httpx>=0.27",
]

[tool.flet]
product = "ایتا منیجر"
org = "app.eitaamanager"

[tool.flet.app]
path = "src"

# ⬇️⬇️⬇️ این بخش حیاتی است ⬇️⬇️⬇️
# قفل کردن تمام کتابخانه‌های خانواده serious_python روی نسخه 4.7.2
# این کار از بروز خطای unzipAsset در اولین اجرای برنامه جلوگیری می‌کند.
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"
serious_python = "4.7.2"
serious_python_android = "4.7.2"
serious_python_platform_interface = "4.7.2"
